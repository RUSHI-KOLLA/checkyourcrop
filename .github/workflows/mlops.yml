name: MLOps Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_MODEL_REPO: ${{ vars.HF_MODEL_REPO }}
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      FLY_APP_NAME: ${{ vars.FLY_APP_NAME }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install flyctl
        run: curl -L https://fly.io/install.sh | sh
        env:
          FLYCTL_INSTALL: /home/runner/.fly
        shell: bash

      - name: Add flyctl to PATH
        run: echo "$HOME/.fly/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run lint, test, build
        run: python scripts/pipeline.py --stage lint,test,build

      - name: Run evaluate, register, deploy_fly, smoke
        if: env.HF_TOKEN != '' && env.HF_MODEL_REPO != '' && env.FLY_API_TOKEN != '' && env.FLY_APP_NAME != ''
        env:
          SERVICE_URL: https://${{ vars.FLY_APP_NAME }}.fly.dev
        run: python scripts/pipeline.py --stage evaluate,register,deploy_fly,smoke